name: Compilar APK ClickTV
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Dar permiso a gradlew
        run: chmod +x ./gradlew
      - name: Compilar APK (debug firmado)
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Preparar APK con nombre fijo
        run: |
          mkdir -p salida
          cp app/build/outputs/apk/debug/app-debug.apk salida/ClickTV.apk
      - name: Leer numero de version
        id: ver
        run: |
          VC=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          echo "vc=$VC" >> "$GITHUB_OUTPUT"
      - name: Publicar Release con el APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.vc }}
          name: ClickTV ${{ steps.ver.outputs.vc }}
          files: salida/ClickTV.apk
          fail_on_unmatched_files: true
      - uses: actions/upload-artifact@v4
        with:
          name: ClickTV-APK
          path: salida/ClickTV.apk
