name: Compilar APK ClickTV
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Dar permiso a gradlew
        run: chmod +x ./gradlew
      - name: Compilar APK (debug firmado)
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Renombrar APK con la version
        run: |
          mkdir -p salida
          cp app/build/outputs/apk/debug/app-debug.apk "salida/ClickTV-$(date +%Y%m%d-%H%M)-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ClickTV-APK
          path: salida/*.apk
          if-no-files-found: error
