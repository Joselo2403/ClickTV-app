name: Compilar APK ClickTV
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Dar permiso a gradlew
        run: chmod +x ./gradlew
      - name: Compilar APK (debug firmado)
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Preparar APK con nombre fijo
        run: |
          mkdir -p salida
          cp app/build/outputs/apk/debug/app-debug.apk salida/ClickTV.apk
      - name: Leer numero de version
        id: ver
        run: |
          VC=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "vc=$VC" >> "$GITHUB_OUTPUT"
          echo "vn=$VN" >> "$GITHUB_OUTPUT"
      - name: Publicar Release con el APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.vc }}
          name: ClickTV ${{ steps.ver.outputs.vc }}
          files: salida/ClickTV.apk
          fail_on_unmatched_files: true
      - name: Generar version.json
        run: |
          cat > version.json <<EOF
          {
            "versionCode": ${{ steps.ver.outputs.vc }},
            "versionName": "${{ steps.ver.outputs.vn }}",
            "apkUrl": "https://github.com/Joselo2403/ClickTV-app/releases/latest/download/ClickTV.apk",
            "notas": "Generado automaticamente por GitHub Actions"
          }
          EOF
          echo "--- version.json generado: ---"
          cat version.json
      - name: Subir version.json al hosting (Hostinger)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          DEST="ftp://$FTP_HOST/domains/tvnetsolutions.com/public_html/clicktv-update"
          # Regla para que el hosting NO cachee el aviso (asi las cajas ven siempre la ultima version)
          printf '%s\n' \
            '<IfModule LiteSpeed>' \
            'RewriteEngine On' \
            'RewriteRule .* - [E=Cache-Control:no-cache]' \
            '</IfModule>' \
            '<IfModule mod_headers.c>' \
            'Header set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"' \
            'Header set Pragma "no-cache"' \
            '</IfModule>' > nocache.htaccess
          up() {
            curl --fail --show-error --silent \
              --connect-timeout 25 --max-time 120 \
              --retry 5 --retry-delay 8 --retry-all-errors \
              -T "$1" "$DEST/$2" --user "$FTP_USER:$FTP_PASSWORD"
          }
          printf '%s\n' '<?php' "header('X-LiteSpeed-Purge: /clicktv-update/version.json');" "echo 'ok';" > purge.php
          up version.json version.json
          up nocache.htaccess .htaccess
          up purge.php purge.php
          echo "archivos subidos; disparando purga de cache LiteSpeed..."
          curl -s --max-time 30 "https://tvnetsolutions.com/clicktv-update/purge.php" || true
          curl -s --max-time 30 "https://www.tvnetsolutions.com/clicktv-update/purge.php" || true
          echo ""
          echo "purga disparada"
      - uses: actions/upload-artifact@v4
        with:
          name: ClickTV-APK
          path: salida/ClickTV.apk
