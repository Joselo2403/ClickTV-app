name: Diagnostico FTP
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Mapear carpetas FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "===== RAIZ ( / ) ====="
          curl -s --user "$FTP_USER:$FTP_PASSWORD" "ftp://$FTP_HOST/" || echo "(no se pudo listar la raiz)"
          echo ""
          echo "===== public_html/ ====="
          curl -s --user "$FTP_USER:$FTP_PASSWORD" "ftp://$FTP_HOST/public_html/" || echo "(no existe public_html)"
          echo ""
          echo "===== domains/ ====="
          curl -s --user "$FTP_USER:$FTP_PASSWORD" "ftp://$FTP_HOST/domains/" || echo "(no existe domains)"
